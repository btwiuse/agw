{{range .}}<tr data-pricing-row><td><input class="field-input" data-pricing-prefix value="{{.ModelPrefix}}" placeholder="gpt-4o" aria-label="模型前缀"></td><td><input class="field-input pricing-rate" type="number" min="0" step="any" inputmode="decimal" data-pricing-input value="{{.InputPer1M}}" aria-label="输入单价 ($/1M)"></td><td><input class="field-input pricing-rate" type="number" min="0" step="any" inputmode="decimal" data-pricing-output value="{{.OutputPer1M}}" aria-label="输出单价 ($/1M)"></td><td><input class="field-input pricing-rate" type="number" min="0" step="any" inputmode="decimal" data-pricing-cache-read value="{{.CacheReadPer1M}}" aria-label="缓存读单价 ($/1M)"></td><td><input class="field-input pricing-rate" type="number" min="0" step="any" inputmode="decimal" data-pricing-cache-write value="{{.CacheWritePer1M}}" aria-label="缓存写单价 ($/1M)"></td><td class="row-actions"><button class="icon-button danger" type="button" data-pricing-delete title="删除定价规则" aria-label="删除定价规则"><i data-lucide="trash-2"></i></button></td></tr>{{else}}<tr><td colspan="6" class="pricing-empty">未配置定价表：Stats 页不会显示成本列。添加一行并保存后，历史成本会立即按新价格重新计算。</td></tr>{{end}}

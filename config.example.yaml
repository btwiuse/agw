debug: false
# 认证值不要写在 config.yaml 里：保存配置时服务端会把字面量 token
# 替换成 secret:<key> 引用，真实值保存在浏览器 localStorage，只在
# 管理页面加载时提交给服务端（内存态）。也可以直接写 env:VAR 引用环境变量。
# 也可以按请求 path 区分 API 风格（Anthropic / Chat Completions / Responses），
# 例如：
# appSelectors:
#   - name: anthropic-messages
#     match:
#       path:
#         - operator: exact
#           value: /v1/messages
#   - name: chat-completions
#     match:
#       path:
#         - operator: exact
#           value: /v1/chat/completions
#   - name: responses-api
#     match:
#       path:
#         - operator: exact
#           value: /v1/responses
# 也可以按 query 参数分流，例如：
#   - name: by-version
#     match:
#       query:
#         - name: api-version
#           operator: prefix
#           value: 2024
# 规则可以设置 enabled: false 临时禁用（缺省视为启用）。
appSelectors:
  - name: openai-client
    match:
      headers:
        - name: User-Agent
          operator: contains
          value: OpenAI
  - name: deepseek-model
    match:
      body:
        - field: model
          operator: prefix
          value: deepseek
    rewrite:
      - field: model
        value: gpt-5.6-luna
  - name: fallback
upstreams:
  - url: https://pai.d1v.ai/v1
    name: luna-primary
    appSelectors: [openai-client]
    authorization:
      type: bearer
      value: replace-with-your-token
  - url: https://deepseek.example/v1
    name: deepseek
    appSelectors: [deepseek-model]
    authorization:
      type: bearer
      value: replace-with-your-deepseek-token
  - url: https://backup.example/v1
    name: fallback
    appSelectors: [fallback]
    authorization:
      type: bearer
      value: replace-with-your-backup-token
# 成本估算（可选）：按模型名前缀匹配的每百万 token 美元单价。
# 最长前缀胜出；未匹配的请求不计成本。留空则 Stats 页不显示成本列。
